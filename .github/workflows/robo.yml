# Robô diário: acrescenta campeões novos (ESPN) e lutas grandes de boxe (Wikipédia) aos
# arquivos de dados, gera a versão do celular e publica no Pages. O app pega na próxima abertura.
# Também roda pelo botão "Run workflow" na aba Actions.
name: Robô diário

on:
  schedule:
    - cron: "0 10 * * *" # 7h em Brasília
    - cron: "0 18 * * *" # 15h em Brasília (a grade da noite às vezes sai no mesmo dia)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        run: python -m robo

      - name: Gerar a versão do celular
        run: python gerar_celular.py

      - name: Guardar e publicar se algo mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- campeoes.json boxe_eventos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # a pasta www do APK é ignorada pelo git de propósito (o workflow do APK copia docs/apk/)
            git add campeoes.json boxe_eventos.json docs
            git commit -m "Robô: dados atualizados ($(date -u +%Y-%m-%d))"
            git push
            # pede ao Pages para publicar de novo (um push feito pelo robô pode não disparar a publicação)
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "aviso: não consegui pedir a publicação do Pages"
          else
            echo "Nada novo hoje."
          fi
