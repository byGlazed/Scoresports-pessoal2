# Robô diário: acrescenta campeões novos (ESPN) e lutas grandes de boxe (Wikipédia) aos
# arquivos de dados, gera a versão do celular e publica no Pages. O app pega na próxima abertura.
# Também roda pelo botão "Run workflow" na aba Actions.
name: Robô diário

on:
  schedule:
    - cron: "0 10 * * *" # 7h em Brasília
    - cron: "0 18 * * *" # 15h em Brasília (a grade da noite às vezes sai no mesmo dia)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o robô
        run: python -m robo

      - name: Gerar a versão do celular
        run: python gerar_celular.py

      # se o main andou durante o robô (código publicado no meio), o script refaz em cima dele e tenta de novo
      - name: Guardar e publicar se algo mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publicar.sh "Robô: dados atualizados ($(date -u +%Y-%m-%d))" campeoes.json boxe_eventos.json transmissoes.json fotos.json kings.json
