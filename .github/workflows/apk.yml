# Monta o APK do Scoresports na nuvem do GitHub a cada push (ou pelo botão "Run workflow")
# e publica em: https://github.com/<seu-usuario>/<repositorio>/releases/latest
# Nas branches "parte..." só monta e testa (não publica). Commits que mudam só dados
# (os do robô diário, por exemplo) não geram APK: o app pega os dados novos pelo Pages.
name: Gerar APK

on:
  push:
    branches: [main, "parte*"]
    paths-ignore:
      - "campeoes.json"
      - "boxe_eventos.json"
      - "transmissoes.json"
      - "docs/**"
      - "android/app/src/main/assets/www/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar as regras de atualização do app (Java)
        run: python testes/rodar_java.py

      # o APK leva exatamente o pacote que está no Pages (docs/apk/, com o versao.txt),
      # para o app não achar que a mesma versão é "outra" e baixar tudo de novo
      - name: Preparar as telas do app (o mesmo pacote publicado no Pages)
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r docs/apk android/app/src/main/assets/www

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Montar o APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Dar nome ao APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Scoresports.apk

      - name: Guardar o APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: Scoresports-apk
          path: Scoresports.apk

      - name: Publicar o APK (link fixo para baixar no celular)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Scoresports para Android
          body: |
            Versão 1.0.${{ github.run_number }}, montada a partir do commit ${{ github.sha }}.
            No celular, baixe o arquivo Scoresports.apk abaixo e abra para instalar.
          files: Scoresports.apk
          make_latest: true
