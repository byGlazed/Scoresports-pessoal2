# Monta o APK do Scoresports na nuvem do GitHub a cada push (ou pelo botão "Run workflow")
# e publica em: https://github.com/<seu-usuario>/<repositorio>/releases/latest
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar as telas do app
        run: python gerar_celular.py

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Montar o APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Dar nome ao APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Scoresports.apk

      - name: Guardar o APK nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: Scoresports-apk
          path: Scoresports.apk

      - name: Publicar o APK (link fixo para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Scoresports para Android
          body: |
            Versão 1.0.${{ github.run_number }}, montada a partir do commit ${{ github.sha }}.
            No celular, baixe o arquivo Scoresports.apk abaixo e abra para instalar.
          files: Scoresports.apk
          make_latest: true
