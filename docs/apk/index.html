<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scoresports</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23e8364c'/></svg>">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#151a24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scoresports">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <div class="app">
    <header class="topo-pagina na-raiz" id="topo-pagina">
      <button class="botao-topo" id="voltar-pagina" type="button" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="titulo-pagina" id="titulo-pagina">Scoresports</h1>
      <div class="acoes-pagina" id="acoes-pagina"></div>
      <button class="botao-topo" id="busca-pagina" type="button" aria-label="Procurar time, jogador ou competição">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <main class="pagina" id="pagina" aria-live="polite"></main>

    <nav class="barra-baixo" id="barra-baixo" aria-label="Seções">
      <button class="aba-baixo" type="button" data-aba="jogos" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span>Jogos</span>
      </button>
      <button class="aba-baixo" type="button" data-aba="favoritos">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2.6l2.9 5.88 6.49.94-4.7 4.58 1.11 6.46L12 17.41l-5.8 3.05 1.11-6.46-4.7-4.58 6.49-.94z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>Favoritos</span>
      </button>
      <button class="aba-baixo" type="button" data-aba="pesquisa">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span>Pesquisa</span>
      </button>
    </nav>
  </div>

  <script src="./nba_quadra.js"></script>
  <script src="./notas_regras.js"></script>
  <script src="./campinho_regras.js"></script>
  <script src="./esports_regras.js"></script>
  <script src="./fotos_regras.js"></script>
  <script src="./rotas.js"></script>
  <script src="./app.js"></script>
  <script src="./esportes.js"></script>
  <script src="./fotos.js"></script>
  <script src="./campinho.js"></script>
  <script src="./esports.js"></script>
  <script src="./busca_regras.js"></script>
  <script src="./inicio.js"></script>
  <script src="./regras_esportes.js"></script>
  <script src="./time_dados.js"></script>
  <script src="./direto.js"></script>
  <script src="./registrar.js"></script>
  <script src="./android.js"></script>
  <script src="./chave_regras.js"></script>
  <script src="./navegacao.js"></script>
  <script src="./chave.js"></script>
</body>
</html>
