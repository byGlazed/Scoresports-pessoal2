<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scoresports</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="/" aria-label="Scoresports, página inicial">
        <span class="marca-ponto" aria-hidden="true"></span>Scoresports
      </a>
      <nav class="esportes" id="esportes" aria-label="Esportes"></nav>
    </div>
    <div class="subnav" id="subnav"></div>
  </header>

  <main class="palco">
    <section class="coluna-lista" id="lista" aria-live="polite"></section>
    <section class="coluna-detalhe" id="detalhe" aria-live="polite">
      <div class="vazio-detalhe">Escolha um jogo para ver os detalhes.</div>
    </section>
  </main>

  <dialog class="painel" id="painel" aria-labelledby="painel-titulo">
    <div class="painel-topo">
      <button class="botao-icone" id="painel-voltar" type="button" aria-label="Voltar" hidden>‹</button>
      <h2 class="painel-titulo" id="painel-titulo"></h2>
      <button class="botao-icone" id="painel-fechar" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="painel-corpo" id="painel-corpo"></div>
  </dialog>

  <script src="/static/app.js"></script>
  <script src="/static/esportes.js"></script>
</body>
</html>
