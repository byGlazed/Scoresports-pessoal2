<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scoresports</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23e8364c'/></svg>">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <button class="botao-icone botao-menu" id="abrir-lateral" type="button" aria-label="Abrir seções e competições">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="marca" href="/" aria-label="Scoresports, página inicial">
        <span class="marca-ponto" aria-hidden="true"></span>Scoresports
      </a>
      <nav class="esportes" id="esportes" aria-label="Esportes"></nav>
      <button class="busca-topo" id="busca-topo" type="button" aria-label="Procurar time, jogador ou competição">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="busca-topo-texto">Procurar time, jogador ou liga</span>
        <kbd>/</kbd>
      </button>
    </div>
  </header>

  <div class="fundo-lateral" id="fundo-lateral" hidden></div>

  <main class="palco">
    <aside class="coluna-lateral" id="lateral" aria-label="Seções e competições"></aside>
    <section class="coluna-lista" id="lista" aria-live="polite"></section>
    <section class="coluna-detalhe" id="detalhe" aria-live="polite">
      <div class="vazio-detalhe">Escolha um jogo para ver os detalhes.</div>
    </section>
  </main>

  <dialog class="painel" id="painel" aria-labelledby="painel-titulo">
    <div class="painel-topo">
      <button class="botao-icone" id="painel-voltar" type="button" aria-label="Voltar" hidden>‹</button>
      <h2 class="painel-titulo" id="painel-titulo"></h2>
      <button class="botao-icone" id="painel-fechar" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="painel-corpo" id="painel-corpo"></div>
  </dialog>

  <script src="/static/nba_quadra.js"></script>
  <script src="/static/rotas.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/esportes.js"></script>
  <script src="/static/busca_regras.js"></script>
  <script src="/static/inicio.js"></script>
</body>
</html>
